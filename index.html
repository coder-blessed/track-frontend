 <script>
  function showLogin() {
    document.getElementById("signupForm").style.display = "none";
    document.getElementById("loginForm").style.display = "block";
    document.getElementById("loginTab").classList.add("active");
    document.getElementById("signupTab").classList.remove("active");
  }

 async function login() {
  const email = document.getElementById("loginEmail").value;
  const password = document.getElementById("loginPassword").value;

  try {
    const res = await axios.post("https://track-backend-pll2.onrender.com/login", { email, password });

    // store token
    localStorage.setItem("token", res.data.token);

    // store the real name from response
    // Use res.data.user.name if your backend sends { token, user: { name } }
    localStorage.setItem("name", res.data.user?.name || "User");

    Swal.fire({
      icon: 'success',
      title: 'Login Successful!',
      text: 'Redirecting to your dashboard...',
      timer: 1500,
      showConfirmButton: false,
      timerProgressBar: true,
    }).then(() => {
      window.location.href = "track.html";
    });

  } catch (err) {
    Swal.fire({
      icon: 'error',
      title: 'Login Failed',
      text: err.response?.data?.message || 'An error occurred. Please try again.',
    });
  }
}
  // SIGNUP
  async function signup() {
  const name = document.getElementById("signupName").value;
  const email = document.getElementById("signupEmail").value;
  const password = document.getElementById("signupPassword").value;

  try {
    // Send signup request
    const res = await axios.post("https://track-backend-pll2.onrender.com/signup", {
      name,
      email,
      password
    });

    // Save token and name from backend response
    localStorage.setItem("token", res.data.token);
    localStorage.setItem("name", res.data.user.name);

    Swal.fire({
      icon: 'success',
      title: 'Signup Successful!',
      text: 'Redirecting...',
      timer: 1500,
      showConfirmButton: false,
      timerProgressBar: true,
    }).then(() => {
      // After signup, go to login form
      showLogin();
    });

  } catch (err) {
    Swal.fire({
      icon: 'error',
      title: 'Signup Failed',
      text: err.response?.data?.message || 'An error occurred. Please try again.',
    });
  }
}


  // Redirect if already logged in
  if (localStorage.getItem("token")) {
    window.location.href = "track.html";
  }

</script>

    async function trackPackage() {
const trackingNumber = document.getElementById("trackingNumber").value.trim();

if (!trackingNumber) {
Swal.fire({
icon: "warning",
title: translations[getSelectedLanguage()].enterTrackingNumber,
text: translations[getSelectedLanguage()].enterTrackingNumberMessage
});
return;
}

const language = getSelectedLanguage();
const t = translations[language];

try {
const res = await axios.get(
`https://track-backend-pll2.onrender.com/api/packages/${trackingNumber}`
);


const data = res.data;

// Translate backend status
const translatedStatus = translateStatus(data.status, language);

// Translate tracking result
document.getElementById("trackingResult").innerHTML = `
  <p>
    <strong>${t.status}:</strong> 
    ${translatedStatus}
  </p>

  <p>
    <strong>${t.location}:</strong> 
    ${data.currentLocation}
  </p>
`;

// Package details
document.getElementById("packageDetails").innerHTML = `
  <p>
    <strong>${t.sender}:</strong> 
    ${data.sender}
  </p>

  <p>
    <strong>${t.recipient}:</strong> 
    ${data.recipient}
  </p>

  <p>
    <strong>${t.origin}:</strong> 
    ${data.origin}
  </p>

  <p>
    <strong>${t.destination}:</strong> 
    ${data.destination}
  </p>
`;

const history = data.history || [];

const historyHtml = history.map(log => `
<p>
📍 <strong>${translateStatus(log.status, language)}</strong>
— ${log.location}
(${new Date(log.timestamp).toLocaleString(getLocale(language))})
</p>
`).join("");

document.getElementById("trackingHistory").innerHTML =
historyHtml || "<p>No tracking history available.</p>";

// Share heading
document.querySelector(".share-options h4").innerHTML = `
  <i class="fas fa-share-alt"></i> ${t.shareTrackingDetails}
`;

// Generate QR code
document.getElementById("qrcode").innerHTML = "";

new QRCode(document.getElementById("qrcode"), {
  text: `${window.location.origin}/track/${trackingNumber}`,
  width: 128,
  height: 128,
  colorDark: "#000",
  colorLight: "#fff",
  correctLevel: QRCode.CorrectLevel.H
});

// Show results
document.getElementById("trackingResults").style.display = "block";

// Share URL
const shareURL =
  `${window.location.origin}/track/${trackingNumber}`;

// WhatsApp
document.getElementById("whatsappShareBtn").onclick = () => {
  const message =
    `${t.trackYourPackage}: ${shareURL}`;

  window.open(
    `https://wa.me/?text=${encodeURIComponent(message)}`,
    "_blank"
  );
};

// Email
document.getElementById("emailShareBtn").onclick = () => {
  window.location.href =
    `mailto:?subject=${encodeURIComponent(t.packageTrackingInfo)}` +
    `&body=${encodeURIComponent(`${t.trackYourPackage}: ${shareURL}`)}`;
};

// Copy link
document.getElementById("copyLinkBtn").onclick = async () => {
  await navigator.clipboard.writeText(shareURL);

  Swal.fire({
    icon: "success",
    title: t.copied,
    text: t.linkCopied,
    timer: 1500,
    showConfirmButton: false
  });
};

// Copy tracking number
document.getElementById("copyNumberBtn").onclick = async () => {
  await navigator.clipboard.writeText(trackingNumber);

  Swal.fire({
    icon: "success",
    title: t.copied,
    text: t.numberCopied,
    timer: 1500,
    showConfirmButton: false
  });
};


} catch (err) {


document.getElementById("trackingResult").textContent =
  `❌ ${t.trackingFailed}`;

document.getElementById("trackingResults").style.display = "none";

document.getElementById("qrcode").innerHTML = "";


}
}

function getLocale(language) {

const locales = {
en: "en-US",
th: "th-TH",
ko: "ko-KR",
"zh-CN": "zh-CN",
"zh-TW": "zh-TW",
ja: "ja-JP"
};

return locales[language] || "en-US";
}


function translateStatus(status, language) {

const statusTranslations = {


pending: {
  en: "Pending",
  th: "รอดำเนินการ",
  ko: "대기 중",
  "zh-CN": "待处理",
  "zh-TW": "待處理",
  ja: "保留中"
},

processing: {
  en: "Processing",
  th: "กำลังดำเนินการ",
  ko: "처리 중",
  "zh-CN": "处理中",
  "zh-TW": "處理中",
  ja: "処理中"
},

shipped: {
  en: "Shipped",
  th: "จัดส่งแล้ว",
  ko: "발송됨",
  "zh-CN": "已发货",
  "zh-TW": "已發貨",
  ja: "発送済み"
},

"in transit": {
  en: "In Transit",
  th: "อยู่ระหว่างการขนส่ง",
  ko: "배송 중",
  "zh-CN": "运输中",
  "zh-TW": "運送中",
  ja: "輸送中"
},

delivered: {
  en: "Delivered",
  th: "จัดส่งสำเร็จ",
  ko: "배송 완료",
  "zh-CN": "已送达",
  "zh-TW": "已送達",
  ja: "配達完了"
},

cancelled: {
  en: "Cancelled",
  th: "ยกเลิกแล้ว",
  ko: "취소됨",
  "zh-CN": "已取消",
  "zh-TW": "已取消",
  ja: "キャンセル済み"
}


};

const normalizedStatus = String(status)
.toLowerCase()
.trim();

return (
statusTranslations[normalizedStatus]?.[language] ||
status
);
}

function getSelectedLanguage() {
  return localStorage.getItem("swiftTrackLanguage") || "en";
}

function getCopyLinkText(language) {
  const text = {
    en: "Copy Link",
    th: "คัดลอกลิงก์",
    ko: "링크 복사",
    "zh-CN": "复制链接",
    "zh-TW": "複製連結",
    ja: "リンクをコピー"
  };
  return text[language] || text.en;
}

function getCopyNumberText(language) {
  const text = {
    en: "Copy Number",
    th: "คัดลอกหมายเลข",
    ko: "번호 복사",
    "zh-CN": "复制号码",
    "zh-TW": "複製號碼",
    ja: "番号をコピー"
  };
  return text[language] || text.en;
}
